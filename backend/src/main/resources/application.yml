server:
  port: 5000
  address: 0.0.0.0

spring:
  application:
    name: roamagent-backend
  datasource:
    url: jdbc:h2:mem:roamagent;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

groq:
  api:
    key: ${GROQ_API_KEY:your_groq_api_key_here}
    model: llama-3.1-8b-instant
    base-url: https://api.groq.com/openai/v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
